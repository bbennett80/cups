{% extends "layout.html" %}

{% block body %}
<div class="auth-card">
  <h1>Teacher Sign In</h1>
  <p class="auth-subtitle">Access your classes and live teacher view.</p>

  {% if error %}
  <div class="form-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/teacher/signin" class="auth-form">
    <input type="hidden" name="next_path" value="{{ next_path or '/teacher/dashboard' }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button type="submit">Sign In</button>
  </form>

  <p class="auth-footer">
    Need an account?
    <a href="/teacher/signup?next_path={{ next_path or '/teacher/dashboard' }}">Create one</a>
  </p>
</div>
{% endblock %}
