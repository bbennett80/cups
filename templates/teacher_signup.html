{% extends "layout.html" %}

{% block body %}
<div class="auth-card">
  <h1>Create Teacher Account</h1>
  <p class="auth-subtitle">Sign up to manage your classes and teacher tools.</p>

  {% if error %}
  <div class="form-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/teacher/signup" class="auth-form">
    <input type="hidden" name="next_path" value="{{ next_path or '/teacher/dashboard' }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8">

    <label for="password_confirm">Confirm Password</label>
    <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" minlength="8">

    <button type="submit">Create Account</button>
  </form>

  <p class="auth-footer">
    Already have an account?
    <a href="/teacher/signin?next_path={{ next_path or '/teacher/dashboard' }}">Sign in</a>
  </p>
</div>
{% endblock %}
